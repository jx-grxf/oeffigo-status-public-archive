# oeffigo-status on the VPS. jg-deploy rebuilds on push to main and runs the dashboard
# bootstrap first, like Railway's preDeploy. Secrets live in /srv/oeffigo-status/env, never here.
# libsql sits on an internal network without internet; only the two apps and the backup job reach it.
name: oeffigo-status
services:
  libsql:
    # Pinned: the image is pulled only when missing, so :latest would silently differ between hosts.
    image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
    restart: unless-stopped
    environment:
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
      SQLD_NODE: primary
    volumes:
      - /srv/oeffigo-status/libsql:/var/lib/sqld
    networks: [db]
    mem_limit: 512m
    mem_reservation: 64m
    oom_score_adj: -500
    pids_limit: 256
    # The wrapper chowns the data dir and drops to the sqld user with gosu; nothing else is needed.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    # The image has neither curl nor wget; bash's /dev/tcp reaches sqld's /health.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: libsql\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Other projects share this host and spike CPU (desk at 150 % on 21.10.); under
    # contention the measuring path gets twice the default weight. No hard cap.
    cpu_shares: 2048

  dashboard:
    build:
      context: ../..
      dockerfile: ops/dashboard.Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?}
        # jg-deploy exports the checked-out commit; /api/source links its public tag.
        SOURCE_COMMIT_SHA: ${SOURCE_COMMIT_SHA:-}
    image: oeffigo-status-dashboard:latest
    restart: unless-stopped
    env_file: /srv/oeffigo-status/env/dashboard.env
    depends_on: [libsql]
    networks: [db, app, edge-status]
    mem_limit: 768m
    mem_reservation: 192m
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck: &health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  status-page:
    build:
      context: ../..
      dockerfile: ops/status-page.Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?}
        # jg-deploy exports the checked-out commit; /api/source links its public tag.
        SOURCE_COMMIT_SHA: ${SOURCE_COMMIT_SHA:-}
    image: oeffigo-status-page:latest
    restart: unless-stopped
    env_file: /srv/oeffigo-status/env/status-page.env
    depends_on: [libsql]
    networks: [db, app, edge-status]
    mem_limit: 768m
    mem_reservation: 192m
    # The collector and alerting live here: first in line for CPU, last for the OOM killer
    # (a build OOM on 20.10. froze one collector run for 73 s).
    cpu_shares: 2048
    oom_score_adj: -300
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck: *health

  # Nightly encrypted dump to R2, started by status-backup.timer (00:17 UTC), not by `up`.
  status-backup:
    build:
      context: ../..
      dockerfile: ops/status-backup.Dockerfile
    image: oeffigo-status-backup:latest
    profiles: [cron]
    env_file: /srv/oeffigo-status/env/status-backup.env
    networks: [db, app]
    mem_limit: 256m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  db:
    internal: true
  app: {}
  edge-status:
    name: edge-status
    external: true
